name: PR Triage Dry Run

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to triage, for example 12"
        required: true
        type: string

permissions:
  pull-requests: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest

    steps:
      # Gets the trusted code from main/default branch, not the PR's code.
      - name: Check out trusted workflow code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Triage the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python scripts/triage_pr.py
