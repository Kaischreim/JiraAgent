name: Jira PR Triage

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      pr_number:
        description: "GitHub PR number, such as 3"
        required: true
        type: string

concurrency:
  group: jira-pr-triage-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  triage:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)

    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted triage code from main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            Agent/prTriage
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install automation packages
        run: pip install -r Agent/prTriage/requirements.txt

      - name: Triage PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

          # Your real folder is capital-A App, so this must match exactly.
          BASE_BRANCH: "main"
          WORK_AREA: "App"

          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}

          ATLASSIAN_EMAIL: ${{ vars.ATLASSIAN_EMAIL }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}

          CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
          CONFLUENCE_PAGE_ID: ${{ vars.CONFLUENCE_PAGE_ID }}

          JIRA_FROM_STATUS: "In Progress"
          JIRA_TO_STATUS: "In Review"

          CLAUDE_MODEL: "claude-sonnet-5"
          MAX_DIFF_CHARS: "30000"

        run: python Agent/prTriage/triage_pr.py
